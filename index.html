<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Science Pupil's Book Standard Three — complete accessible textbook">
  <title>Science Pupil's Book Standard Three</title>
  <link href="./content/tailwind_output.css" rel="stylesheet">
  <link href="./assets/fonts.css" rel="stylesheet">
  <style>
    :root { color-scheme: light; font-family: Arial, sans-serif; --blue: #087ea4; --ink: #17313b; }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: #eaf6fb; color: var(--ink); }
    .site-header { position: sticky; top: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: .8rem 1rem; background: var(--blue); color: white; box-shadow: 0 2px 10px #073c5033; }
    .site-header h1 { margin: 0; font: 700 clamp(1rem, 2.5vw, 1.35rem)/1.2 Arial, sans-serif; }
    .jump { display: flex; align-items: center; gap: .5rem; }
    .jump label { font-weight: 700; }
    .jump input, .jump button { min-height: 40px; border-radius: 9px; font: inherit; }
    .jump input { width: 5.5rem; border: 2px solid #bce0ec; padding: .4rem; text-align: center; }
    .jump button { border: 2px solid white; padding: .4rem .8rem; background: white; color: #075e7c; font-weight: 700; cursor: pointer; }
    #status { min-width: 8rem; font-weight: 700; text-align: right; }
    #textbook { width: min(1180px, 100%); margin: 0 auto; padding: 1.25rem; }
    .textbook-page { position: relative; margin: 0 0 2rem; overflow: hidden; border: 1px solid #c9e3ec; border-radius: 16px; background: white; box-shadow: 0 8px 24px #0b526414; }
    .page-marker { position: sticky; top: 66px; z-index: 20; display: inline-block; margin: .7rem 0 0 .7rem; border-radius: 999px; padding: .35rem .7rem; background: #075e7c; color: white; font: 700 .9rem/1 Arial, sans-serif; }
    .page-content { overflow: hidden; }
    .page-content > * { opacity: 1 !important; }
    .load-error { margin: 1rem; padding: 1rem; border-left: 5px solid #b42318; background: #fff3f1; color: #7a1712; }
    .loading { padding: 4rem 1rem; text-align: center; font-size: 1.1rem; }
    .skip-link { position: absolute; left: -9999px; top: .5rem; z-index: 200; background: white; color: #075e7c; padding: .6rem; }
    .skip-link:focus { left: .5rem; }
    @media (max-width: 700px) {
      .site-header { position: static; align-items: stretch; flex-direction: column; }
      .jump { flex-wrap: wrap; }
      #status { text-align: left; }
      #textbook { padding: .5rem; }
      .textbook-page { border-radius: 8px; }
      .page-marker { position: static; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#textbook">Skip to textbook</a>
  <header class="site-header">
    <h1>Science Pupil's Book Standard Three</h1>
    <div class="jump" aria-label="Jump to a textbook page">
      <label for="page-number">Page</label>
      <input id="page-number" type="number" min="1" value="1" inputmode="numeric">
      <button id="go" type="button">Go</button>
      <span id="status" aria-live="polite">Loading pages…</span>
    </div>
  </header>
  <main id="textbook">
    <p class="loading" id="loading">Loading the complete textbook in consecutive order…</p>
  </main>
  <noscript><p class="loading">JavaScript is required to assemble the textbook. Use the <a href="changes.html">complete page directory</a> instead.</p></noscript>
  <script>
    const textbook = document.querySelector('#textbook');
    const loading = document.querySelector('#loading');
    const status = document.querySelector('#status');
    const pageNumber = document.querySelector('#page-number');
    const go = document.querySelector('#go');
    let totalPages = 0;

    function jumpToPage() {
      const requested = Number.parseInt(pageNumber.value, 10);
      if (!Number.isInteger(requested) || requested < 1 || requested > totalPages) return;
      document.querySelector(`#page-${requested}`)?.scrollIntoView({ block: 'start' });
      history.replaceState(null, '', `#page-${requested}`);
    }

    function buildPage(page, number, html) {
      const parsed = new DOMParser().parseFromString(html, 'text/html');
      const source = parsed.querySelector('#content');
      if (!source || !source.querySelector('section')) throw new Error('No textbook content found');
      const article = document.createElement('article');
      article.className = 'textbook-page';
      article.id = `page-${number}`;
      article.dataset.sectionId = page.section_id;
      article.setAttribute('aria-label', `Page ${number}`);
      const marker = document.createElement('div');
      marker.className = 'page-marker';
      marker.textContent = `Page ${number}`;
      const content = document.createElement('div');
      content.className = 'page-content';
      for (const child of [...source.children]) content.append(child.cloneNode(true));
      content.querySelectorAll('.opacity-0').forEach(element => element.classList.remove('opacity-0'));
      content.querySelectorAll('[id="interface-container"], [id="nav-container"], script').forEach(element => element.remove());
      article.append(marker, content);
      return article;
    }

    async function loadBook() {
      const response = await fetch('content/pages.json', { cache: 'no-store' });
      if (!response.ok) throw new Error('The textbook page list could not be loaded');
      const pages = await response.json();
      totalPages = pages.length;
      pageNumber.max = totalPages;
      loading.remove();
      const batchSize = 10;
      for (let start = 0; start < pages.length; start += batchSize) {
        const batch = pages.slice(start, start + batchSize);
        const results = await Promise.all(batch.map(async (page, offset) => {
          const number = start + offset + 1;
          try {
            const pageResponse = await fetch(page.href, { cache: 'no-store' });
            if (!pageResponse.ok) throw new Error(`HTTP ${pageResponse.status}`);
            return buildPage(page, number, await pageResponse.text());
          } catch (error) {
            const message = document.createElement('article');
            message.className = 'textbook-page load-error';
            message.id = `page-${number}`;
            message.textContent = `Page ${number} could not be displayed: ${error.message}`;
            return message;
          }
        }));
        textbook.append(...results);
        status.textContent = `${Math.min(start + batch.length, totalPages)} of ${totalPages} loaded`;
      }
      status.textContent = `${totalPages} pages`;
      const requested = Number.parseInt(location.hash.replace('#page-', ''), 10);
      if (Number.isInteger(requested) && requested >= 1 && requested <= totalPages) {
        pageNumber.value = requested;
        jumpToPage();
      }
    }

    go.addEventListener('click', jumpToPage);
    pageNumber.addEventListener('keydown', event => { if (event.key === 'Enter') jumpToPage(); });
    loadBook().catch(error => {
      loading.className = 'load-error';
      loading.textContent = `${error.message}. Please reload this page.`;
      status.textContent = 'Unable to load';
    });
  </script>
</body>
</html>

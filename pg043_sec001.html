      document.querySelectorAll('#content tbody tr').forEach((row, rowIndex) => {
        row.querySelectorAll('input[type="checkbox"]').forEach((choice) => {
          choice.type = 'radio';
          choice.name = `classification-${rowIndex + 1}`;
          choice.classList.add('tick-choice');
        });
      });
    </script>

    <script>
      document.querySelectorAll('#content tbody tr').forEach((row) => {
        const choices = row.querySelectorAll('.tick-choice');
        choices.forEach((choice) => choice.addEventListener('change', () => {
          if (choice.checked) choices.forEach((other) => { if (other !== choice) other.checked = false; });
        }));
      });
